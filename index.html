<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>COD Shield - Anti-Fraud Order Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-6 flex flex-col items-center">
  <div class="max-w-xl w-full bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl mt-8">
    <div class="flex items-center gap-3 border-b border-gray-700 pb-4 mb-4">
      <i class="fa-solid fa-shield-halved text-emerald-400 text-2xl"></i>
      <div>
        <h1 class="text-xl font-bold text-white">COD Shield: Anti-Fraud Validator</h1>
        <p class="text-xs text-gray-400">Prevent fake orders & courier return costs</p>
      </div>
    </div>

    <div class="space-y-4 text-sm">
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">Customer Phone Number</label>
        <input id="phone-input" type="text" value="+92 300 1234567" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">Delivery Address</label>
        <input id="addr-input" type="text" value="Street 5, Sector F-8, Islamabad" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white">
      </div>
      <button onclick="checkRisk()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-lg text-white transition">Evaluate Order Risk</button>
    </div>

    <div id="risk-result" class="mt-6 p-4 rounded-xl bg-gray-900 border border-gray-700 hidden">
      <div class="flex items-center justify-between">
        <span class="text-xs text-gray-400">Risk Assessment</span>
        <span class="text-xs font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400">LOW RISK (98% Safe)</span>
      </div>
      <p class="text-xs text-gray-300 mt-2">✓ Valid telecom prefix verified.<br>✓ Address format contains sector & city.<br>✓ Zero historical return flags.</p>
    </div>
  </div>
  <script>
    function checkRisk() {
      document.getElementById("risk-result").classList.remove("hidden");
    }
  </script>
</body>
</html>
